name: Собрать Demon Launcher APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  apk:
    name: Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Получить проект
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK 35
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "Не найден Android sdkmanager"
            exit 1
          fi
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Собрать APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Опубликовать APK
        uses: actions/upload-artifact@v4
        with:
          name: Demon-Launcher-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
